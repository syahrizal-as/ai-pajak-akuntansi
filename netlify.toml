# Konfigurasi mandiri bila folder pajak dipilih sebagai base deploy.
# Tidak mengubah konfigurasi atau deployment portal kelas yang ada.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
